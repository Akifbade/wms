name: Build & Deploy to VPS (GHCR)

on:
  push:
    branches:
      - stable/prisma-mysql-production
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repo Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          build-args: |
            NODE_ENV=production

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          build-args: |
            REACT_APP_API_URL=https://qgocargo.cloud/api
            VITE_API_URL=https://qgocargo.cloud/api
            NODE_ENV=production

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: 148.230.107.155
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "🚀 Starting Deployment..."
            cd "/root/NEW START"
            
            # 1. Update Code (to get latest vps-deploy.sh)
            git fetch origin stable/prisma-mysql-production
            git reset --hard origin/stable/prisma-mysql-production
            
            # 2. Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 3. Pull latest images
            echo "⬇️ Pulling images..."
            docker pull ghcr.io/akifbade/wms-backend:latest
            docker pull ghcr.io/akifbade/wms-frontend:latest
            
            # 4. Run Deployment Script
            chmod +x vps-deploy.sh
            ./vps-deploy.sh
