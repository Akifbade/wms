name: Build & Deploy to VPS (GHCR)

on:
  push:
    branches:
      - stable/prisma-mysql-production
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Get Version
        id: version
        run: |
          VERSION=$(cat VERSION.md | grep -oP 'v\d+\.\d+\.\d+' | head -1)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.VERSION }}
          build-args: |
            NODE_ENV=production
          no-cache: true

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ steps.version.outputs.VERSION }}
          build-args: |
            VITE_API_URL=https://qgocargo.cloud/api
            NODE_ENV=production
          no-cache: true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Build Complete - Manual Deployment Required
        run: |
          echo "✅ Docker images built and pushed to GHCR successfully!"
          echo ""
          echo "📦 Images available at:"
          echo "  - ghcr.io/akifbade/wms-backend:latest"
          echo "  - ghcr.io/akifbade/wms-frontend:latest"
          echo ""
          echo "🚀 TO DEPLOY TO VPS:"
          echo "  Run this command on your local machine:"
          echo "  .\deploy-vps-manual.ps1"
          echo ""
          echo "⚠️ Why manual? GitHub Actions IPs are blocked by VPS firewall on port 22"
