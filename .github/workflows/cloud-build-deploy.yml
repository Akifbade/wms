name: Build & Deploy to VPS (GHCR)

on:
  push:
    branches:
      - stable/prisma-mysql-production
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Get Version
        id: version
        run: |
          VERSION=$(cat VERSION.md | grep -oP 'v\d+\.\d+\.\d+' | head -1)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.VERSION }}
          build-args: |
            NODE_ENV=production
          no-cache: true

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ steps.version.outputs.VERSION }}
          build-args: |
            VITE_API_URL=https://qgocargo.cloud/api
            NODE_ENV=production
          no-cache: true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger VPS Webhook Deployment
        run: |
          echo "🚀 Triggering VPS to pull and deploy..."
          echo "Images pushed to GHCR successfully"
          echo "VPS will auto-pull via webhook or manual trigger"
          echo ""
          echo "⚠️ SSH from GitHub Actions is blocked by VPS firewall"
          echo "✅ Use: plink to manually trigger deployment on VPS"
          echo ""
          echo "Manual deployment command:"
          echo "plink -batch -pw <password> root@148.230.107.155 'cd /root/NEW\\ START && ./vps-webhook-deploy.sh'"
