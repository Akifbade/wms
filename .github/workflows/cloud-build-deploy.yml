name: Build & Deploy to VPS (GHCR)

on:
  push:
    branches:
      - stable/prisma-mysql-production
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Get Version
        id: version
        run: |
          VERSION=$(cat VERSION.md | grep -oP 'v\d+\.\d+\.\d+' | head -1)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.VERSION }}
          build-args: |
            NODE_ENV=production
          no-cache: true

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ steps.version.outputs.VERSION }}
          build-args: |
            VITE_API_URL=https://qgocargo.cloud/api
            NODE_ENV=production
          no-cache: true

      # Save images as tar files to transfer to VPS
      - name: Save Docker images
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest | gzip > backend.tar.gz
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest | gzip > frontend.tar.gz
          ls -lh *.tar.gz

      - name: Copy images to VPS
        uses: appleboy/scp-action@master
        with:
          host: 148.230.107.155
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "backend.tar.gz,frontend.tar.gz"
          target: "/root/"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Secrets
        env:
          VPS_PASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          if [ -z "$VPS_PASS" ]; then
            echo "::error::VPS_PASSWORD secret is NOT set!"
            exit 1
          else
            echo "✅ VPS_PASSWORD is set"
          fi

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        timeout-minutes: 12
        with:
          host: 148.230.107.155
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 10m
          script: |
            echo "🚀 Starting Deployment..."
            cd "/root/NEW START"
            
            # 1. Update Code
            echo "📥 Pulling latest code..."
            git fetch origin stable/prisma-mysql-production
            git reset --hard origin/stable/prisma-mysql-production
            
            # 2. Load images from transferred tar files
            echo "📦 Loading Docker images from tar files..."
            docker rmi ghcr.io/akifbade/wms-backend:latest 2>/dev/null || true
            docker rmi ghcr.io/akifbade/wms-frontend:latest 2>/dev/null || true
            
            gunzip -c /root/backend.tar.gz | docker load
            gunzip -c /root/frontend.tar.gz | docker load
            
            rm -f /root/backend.tar.gz /root/frontend.tar.gz
            
            echo "✅ Images loaded:"
            docker images | grep wms
            
            # 3. Run Deployment Script
            chmod +x vps-deploy.sh
            ./vps-deploy.sh
