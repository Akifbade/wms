# ╔══════════════════════════════════════════════╗
# ║  WMS STAGING - HTTP Only, No Redirects      ║
# ║  Access via: http://VPS_IP:4080             ║
# ╚══════════════════════════════════════════════╝

server {
    listen 80;
    server_name _;  # Accept ANY hostname (IP, domain, localhost)

    root /usr/share/nginx/html;
    index index.html;

    # NO CACHING - Dev/Staging mode
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    etag off;
    if_modified_since off;

    # Redirect old /uploads/logos/ to /uploads/company-logos/
    location /uploads/logos/ {
        rewrite ^/uploads/logos/company-logo-(.*)$ /uploads/company-logos/company-$1 last;
        rewrite ^/uploads/logos/(.*)$ /uploads/company-logos/$1 last;
    }

    location ~* ^/uploads/(?:company-logos/)?company-logo-(.*)$ {
        rewrite ^/uploads/(?:company-logos/)?company-logo-(.*)$ /uploads/company-logos/company-$1 last;
    }

    # Proxy uploads to STAGING backend
    location /uploads/ {
        if ($uri ~* ^/uploads/(?:logos/)?company-logo-(.*)$) {
            rewrite ^/uploads/(?:logos/)?company-logo-(.*)$ /uploads/company-logos/company-$1 last;
        }
        proxy_pass http://backend-staging:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # API proxy to STAGING backend
    location /api {
        proxy_pass http://backend-staging:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # SPA fallback - all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html - no cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
