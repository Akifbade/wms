version: '3.8'

# STAGING ENVIRONMENT - Uses SAME database container as production
# Database: warehouse_wms_staging (in wms-database container)
# Run with: docker-compose -f docker-compose.yml -f docker-compose.staging.yml up -d staging-backend staging-frontend

services:
  # Staging Backend - connects to warehouse_wms_staging in SAME database
  staging-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wms-staging-backend
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      # KEY: Same database container, different database name
      DATABASE_URL: mysql://wms_user:wmspassword123@database:3306/warehouse_wms_staging
      JWT_SECRET: ${STAGING_JWT_SECRET:-staging-secret-key}
      PORT: 5001
    ports:
      - "5001:5001"
    volumes:
      - ./backend/uploads-staging:/app/uploads
      - ./backend/logs-staging:/app/logs
    depends_on:
      database:
        condition: service_healthy
    networks:
      - wms-network
    command: sh -c "npx prisma migrate deploy || npx prisma db push && npx ts-node src/index.ts"

  # Staging Frontend
  staging-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://staging-backend:5001
    container_name: wms-staging-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://staging-backend:5001
      NODE_ENV: staging
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx-http-only.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - staging-backend
    networks:
      - wms-network

# Use the same network as production
networks:
  wms-network:
    external: true
    name: newstart_wms-network
