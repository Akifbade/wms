version: '3.8'

# STAGING ENVIRONMENT - Completely separate from production
# All services, containers, ports, volumes, and networks are distinct
# Run with: docker-compose -f docker-compose.staging.yml up -d

services:
  # Staging Database
  database-staging:
    image: mysql:8.0
    container_name: wms-database-staging
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: warehouse_wms_staging
      MYSQL_USER: wms_user_staging
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3407:3306"
    volumes:
      - mysql_data_staging:/var/lib/mysql
    networks:
      - wms-staging-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.2G
        reservations:
          memory: 600M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Staging Backend
  backend-staging:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-2.4.0}
        COMMIT_HASH: ${COMMIT_HASH:-local-dev}
        COMMIT_MESSAGE: ${COMMIT_MESSAGE:-local-build}
        BRANCH: ${BRANCH:-staging}
        COMMIT_COUNT: ${COMMIT_COUNT:-0}
        DEPLOYMENT_STAGE: staging
    container_name: wms-backend-staging
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      DATABASE_URL: mysql://wms_user_staging:st...g@wms-database-staging:3306/warehouse_wms_staging
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
      FRONTEND_URL: http://localhost:4080
      APP_PUBLIC_URL: http://localhost:4080
    ports:
      - "6000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - /root/wms-staging-backups:/backups
      - /root/wms-staging-full-backups:/full-backups
    depends_on:
      database-staging:
        condition: service_healthy
    networks:
      - wms-staging-network
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 800M
        reservations:
          memory: 400M
    command: sh -c "npx prisma migrate deploy && npx ts-node src/index.ts"

  # Staging Frontend
  frontend-staging:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-2.4.0}
        VITE_APP_COMMIT_HASH: ${VITE_APP_COMMIT_HASH}
        VITE_APP_COMMIT_MESSAGE: ${VITE_APP_COMMIT_MESSAGE}
        VITE_APP_BRANCH: ${VITE_APP_BRANCH:-staging}
        VITE_APP_ENV: staging
        COMMIT_COUNT: ${COMMIT_COUNT}
    container_name: wms-frontend-staging
    restart: unless-stopped
    ports:
      - "4080:80"
    volumes:
      - ./frontend/nginx-staging.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend-staging
    networks:
      - wms-staging-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 300M
        reservations:
          memory: 150M

  # phpMyAdmin for Staging Database
  phpmyadmin-staging:
    image: phpmyadmin:latest
    container_name: wms-phpmyadmin-staging
    restart: unless-stopped
    environment:
      PMA_HOST: wms-database-staging
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "8083:80"
    depends_on:
      database-staging:
        condition: service_healthy
    networks:
      - wms-staging-network

networks:
  wms-staging-network:
    driver: bridge

volumes:
  mysql_data_staging:
    driver: local
