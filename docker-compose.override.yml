services:
  frontend:
    ports:
      - "3080:80"
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf

  backend:
    environment:
      DATABASE_URL: 'mysql://wms_user:wmspassword123@wms-database:3306/warehouse_wms'
      JWT_SECRET: 'change...tion'
      FRONTEND_URL: https://qgocargo.cloud
      APP_PUBLIC_URL: https://qgocargo.cloud
      BACKUP_DIR: /backups
      FULL_BACKUP_DIR: /full-backups
      NODE_ENV: production
      PORT: "5000"

networks:
  wms-network:
    external: true
