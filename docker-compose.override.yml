# Staging overrides — merges with docker-compose.yml automatically
services:
  frontend:
    ports:
      - "4080:80"
    networks:
      - wms-staging-network

  backend:
    environment:
      DATABASE_URL: mysql://wms_user_staging:***@wms-database-staging:3306/warehouse_wms_staging
      JWT_SECRET: 'staging...secret...change'
      FRONTEND_URL: https://staging.qgocargo.cloud
      APP_PUBLIC_URL: https://staging.qgocargo.cloud
      NODE_ENV: production
      PORT: "5000"
    networks:
      - wms-staging-network

  database:
    ports:
      - "3407:3306"
    networks:
      - wms-staging-network

  phpmyadmin:
    ports:
      - "8083:80"
    networks:
      - wms-staging-network
