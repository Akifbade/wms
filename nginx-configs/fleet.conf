# QGO Fleet - track.qgocargo.cloud
# Completely separate from WMS

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name track.qgocargo.cloud;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name track.qgocargo.cloud;
    
    # Fleet app static files
    root /var/www/track.qgocargo.cloud;
    index index.html;
    
    # SSL certificates - SEPARATE from WMS!
    ssl_certificate /etc/letsencrypt/live/track.qgocargo.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/track.qgocargo.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:FleetSSL:10m;
    ssl_session_timeout 10m;
    
    # Gzip
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;
    
    # Parse Server API
    location ^~ /parse/ {
        proxy_pass http://127.0.0.1:1337/parse/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # Parse API alternative path
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # APK download
    location ^~ /app-debug.apk {
        alias /var/www/track.qgocargo.cloud/app-debug.apk;
        add_header Content-Type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename=QGO-Cargo-Fleet.apk';
    }
    
    # Static files (React/Vue app)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-store, no-cache, must-revalidate';
        expires 0;
    }
    
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
